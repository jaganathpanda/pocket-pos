name: Sync to Production Repo

on:
  push:
    branches:
      - prod

jobs:
  sync:
    if: github.repository == 'jaganathpanda/pocket-pos' && github.ref == 'refs/heads/prod'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Add Production Remote
        run: |
          git remote add prod-repo https://x-access-token:${{ secrets.PROD_REPO_TOKEN }}@github.com/mypocketpos/mypocketpos.git
      - name: Debug Token Presence
        run: |
          if [ -z "${{ secrets.PROD_REPO_TOKEN }}" ]; then
            echo "❌ TOKEN NOT FOUND"
            exit 1
          else
            echo "✅ TOKEN FOUND"
          fi
       
      - name: Push to Production Repo
        run: |
          git push prod-repo prod --force --verbose
