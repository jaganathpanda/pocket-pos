name: Sync to Production Repo

on:
  push:
    branches:
      - prod

jobs:
  sync:
    # Prevent infinite loop + ensure correct repo
    if: github.repository == 'jaganathpanda/pocket-pos'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # 🔥 critical for PAT usage

      - name: Verify Token Exists
        run: |
          if [ -z "${{ secrets.PROD_REPO_TOKEN }}" ]; then
            echo "❌ PROD_REPO_TOKEN is missing"
            exit 1
          else
            echo "✅ Token detected"
          fi

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      # 🔥 REMOVE SYNC WORKFLOW BEFORE PUSH
      - name: Remove unwanted workflow files
        run: |
          rm -f .github/workflows/sync-to-prod.yml

      - name: Commit cleanup (if needed)
        run: |
          git add -A
          git commit -m "Remove sync workflow for production repo" || echo "No changes to commit"

      - name: Push to Production Repo
        env:
          TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
        run: |
          echo "🚀 Syncing branch: ${{ github.ref_name }}"

          git remote add target "https://x-access-token:${TOKEN}@github.com/mypocketpos/mypocketpos.git"

          # fetch to avoid stale info error
          git fetch target

          git push target HEAD:${{ github.ref_name }} --force-with-lease --verbose